[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cindes"
version = "0.1.0"
description = "Reproducible implementation of CINDES"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "nflows>=0.14",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.0",
]

[project.optional-dependencies]
lincde = ["rpy2>=3.6,<4"]

[tool.setuptools.packages.find]
include = ["cindes*", "experiments*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
